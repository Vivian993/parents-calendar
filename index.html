<!DOCTYPE html>

<style>
  :root{
    --cream:#FFF8EF;
    --card:#FFFFFF;
    --plum:#7A4763;
    --plum-dark:#5E3650;
    --coral:#E1735A;
    --coral-dark:#C85A42;
    --sage:#7C9885;
    --gold:#FBE3A0;
    --gold-text:#8A6114;
    --red:#D14343;
    --ink:#3B2E35;
    --ink-soft:#7A6B72;
    --line:#EFDFCB;
    --hospital-bg:#DCEEFB; --hospital-text:#1F5C8B;
    --hair-bg:#FBE1EC; --hair-text:#A73D6B;
    --bill-bg:#E3F1DE; --bill-text:#3F7A34;
    --other-bg:#EFEAF2; --other-text:#5E4A6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .top{
    background:linear-gradient(135deg,var(--plum),var(--plum-dark));
    color:#fff;
    padding:12px 16px 14px;
    border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(94,54,80,.25);
    position:relative;
    flex:0 0 auto;
  }
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .clock{
    font-size:clamp(1.7rem,6.5vh,2.4rem);
    font-weight:800;
    letter-spacing:1.5px;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .date-line{
    font-size:clamp(.9rem,2.4vh,1.05rem);
    margin-top:6px;
    opacity:.95;
    font-weight:600;
  }
  .settings-btn{
    background:rgba(255,255,255,.18);
    border:none;
    color:#fff;
    font-size:1.4rem;
    width:44px;height:44px;
    border-radius:14px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .cal-card{
    background:var(--card);
    margin:10px 10px 0;
    border-radius:20px;
    box-shadow:0 4px 16px rgba(122,71,99,.10);
    padding:10px 8px 10px;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 4px 8px;
    flex:0 0 auto;
  }
  .nav-btn{
    background:var(--gold);
    color:var(--gold-text);
    border:none;
    width:42px;height:42px;
    border-radius:13px;
    font-size:1.4rem;
    font-weight:700;
    cursor:pointer;
  }
  .month-label{
    font-size:clamp(1.15rem,3.4vh,1.5rem);
    font-weight:800;
    color:var(--plum-dark);
  }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-weight:700;
    font-size:.92rem;
    color:var(--ink-soft);
    padding-bottom:5px;
    border-bottom:2px solid var(--line);
    margin-bottom:5px;
    flex:0 0 auto;
  }
  .weekday-row div:first-child{color:var(--coral-dark);}
  .weekday-row div:last-child{color:var(--plum);}
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:4px;
    flex:1 1 auto;
    min-height:0;
  }
  .day-cell{
    min-height:0;
    min-width:0;
    border-radius:13px;
    background:#FCFAF6;
    border:1px solid var(--line);
    padding:5px 4px 3px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  .day-cell.other-month{opacity:.35;}
  .day-cell.holiday{background:var(--gold);border-color:#EFCB6E;}
  .day-cell.today{outline:3px solid var(--coral);outline-offset:-3px;}
  .day-num{
    font-size:clamp(.95rem,2.6vh,1.35rem);
    font-weight:800;
    color:var(--ink);
    line-height:1;
  }
  .day-cell.weekend-sun .day-num{color:var(--coral-dark);}
  .day-cell.weekend-sat .day-num{color:var(--plum);}
  .lunar-txt{
    font-size:clamp(.6rem,1.5vh,.82rem);
    color:var(--ink-soft);
    margin-top:2px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lunar-txt.red{color:var(--red);font-weight:800;}
  .holiday-name{
    font-size:clamp(.55rem,1.3vh,.72rem);
    color:var(--gold-text);
    font-weight:800;
    margin-top:1px;
    line-height:1.1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .events-wrap{
    display:flex;
    flex-direction:column;
    gap:1px;
    margin-top:3px;
    overflow:hidden;
  }
  .evt-line{

    font-weight:800;
    line-height:1.18;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;

  .evt-line.cat-hair{color:var(--hair-text);}
  .evt-line.cat-bill{color:var(--bill-text);}
  .evt-line.cat-other{color:var(--other-text);}
  .evt-more{font-size:clamp(.53rem,1.2vh,.68rem);color:var(--ink-soft);font-weight:700;}

    background:rgba(59,46,53,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;

  .overlay.hidden{display:none;}
  .sheet{
    background:var(--card);
    width:100%;max-width:520px;
    border-radius:26px 26px 0 0;

    overflow-y:auto;

  .sheet.center{

    margin:0 14px;
    max-height:90vh;
  }
  .sheet-title{
    font-size:1.5rem;font-weight:800;color:var(--plum-dark);
    margin-bottom:4px;
  }
  .sheet-sub{color:var(--ink-soft);font-size:.95rem;margin-bottom:14px;}
  .existing-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .existing-item{

    background:#FBF6EF;border-radius:14px;padding:10px 12px;
    font-size:1.05rem;font-weight:600;

  .existing-item .icon{font-size:1.4rem;}
  .existing-item .txt{flex:1;}
  .existing-item button{

  label.field-label{

    font-size:1.25rem;
    padding:13px 12px;
    border-radius:14px;

  .existing-item.cat-hospital{background:var(--hospital-bg);color:var(--hospital-text);}
  .existing-item.cat-hair{background:var(--hair-bg);color:var(--hair-text);}
  .existing-item.cat-bill{background:var(--bill-bg);color:var(--bill-text);}

  .checkbox-row input{width:24px;height:24px;}

    <input type="file" id="importFileInput" accept="application/json" style="display:none;">

<script>

0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,
0x0d520];
function leapMonthOf(y){return LUNAR_INFO[y-1900]&0xf;}
function leapDaysOf(y){return leapMonthOf(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0;}
function monthDaysOf(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function lYearDaysOf(y){
  let sum=348; const info=LUNAR_INFO[y-1900];
  for(let i=0x8000;i>0x8;i>>=1){sum+=(info&i)?1:0;}
  return sum+leapDaysOf(y);
}
function solar2lunar(y,m,d){
  if(y<1900||y>2100) return null;
  let offset=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  let i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDaysOf(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  const lYear=i;
  const leap=leapMonthOf(lYear);
  let isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===leap+1&&!isLeap){i--;isLeap=true;temp=leapDaysOf(lYear);}
    else{temp=monthDaysOf(lYear,i);}
    if(isLeap&&i===leap+1)isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){
    if(isLeap){isLeap=false;}else{isLeap=true;i--;}
  }
  if(offset<0){offset+=temp;i--;}
  return {lYear,lMonth:i,lDay:offset+1,isLeap};
}
const N1=['日','一','二','三','四','五','六','七','八','九','十'];
const N2=['初','十','廿','卅'];
function dayCn(d){
  if(d===10)return '初十'; if(d===20)return '二十'; if(d===30)return '三十';
  return N2[Math.floor(d/10)]+N1[d%10];
}

/* ============ 類別設定 ============ */
const CATS={
  hospital:{label:'醫院（回診）',icon:'🏥'},
  hair:{label:'美髮',icon:'💇'},
  bill:{label:'繳費',icon:'💰'},
  other:{label:'其他',icon:'📌'}
};

/* ============ 儲存輔助（改用瀏覽器 localStorage） ============ */
/* 注意：window.storage 只有在 Claude.ai 的 Artifact 預覽環境才存在；
   這個檔案是要放到 GitHub Pages／自己網站上讓爸媽當作獨立網頁使用，
   所以必須改用瀏覽器原生的 localStorage，才能真正把資料存在手機本機上。 */
async function sGet(key){
  try{
    const raw=localStorage.getItem(key);
    return raw!=null ? JSON.parse(raw) : null;
  }catch(e){ console.error('storage get fail',e); return null; }
}
async function sSet(key,val){
  try{
    localStorage.setItem(key,JSON.stringify(val));
    return true;
  }catch(e){ console.error('storage set fail',e); return false; }
}
function dKey(y,m,d){ return `${y}-${m}-${d}`; }

const DEFAULT_SETTINGS={topic:'',hour:8,minute:0,lunarReminder:true};

// 記憶體快取：整個 app 只用三把 key（events / settings / notiflog），
// 讀寫都在記憶體裡完成，最後才整包寫回，避免逐日逐格呼叫造成頻率限制而「新增失敗」。
let EVENTS={};      // { "2026-8-27": [ {id,cat,icon,text}, ... ] }
let SETTINGS={...DEFAULT_SETTINGS};
let NOTIFLOG={};     // { "sched:2026-8-27": {...}, "schedLunar:2026-8-27": {...} }
let dataLoaded=false;

async function loadAllData(){
  const [ev,st,nl]=await Promise.all([sGet('events'),sGet('settings'),sGet('notiflog')]);
  EVENTS = ev || {};
  SETTINGS = {...DEFAULT_SETTINGS, ...(st||{})};
  NOTIFLOG = nl || {};
  dataLoaded=true;
}

function getEvents(y,m,d){ return EVENTS[dKey(y,m,d)] || []; }
async function persistEvents(){ return sSet('events',EVENTS); }

function getSettings(){ return SETTINGS; }
async function saveSettings(partial){
  SETTINGS = {...SETTINGS, ...partial};
  return sSet('settings',SETTINGS);
}
async function persistNotifLog(){ return sSet('notiflog',NOTIFLOG); }

/* ============ ntfy 推播 ============ */
function ntfyUrl(topic){
  if(/^https?:\/\//i.test(topic)) return topic;
  return 'https://ntfy.sh/'+encodeURIComponent(topic);
}
async function sendNtfy(topic,message,delaySeconds){
  if(!topic) return false;
  const headers={'Content-Type':'text/plain; charset=utf-8'};
  if(delaySeconds && delaySeconds>0) headers['Delay']=Math.ceil(delaySeconds)+'s';
  try{
    const res=await fetch(ntfyUrl(topic),{method:'POST',headers,body:message});
    return res.ok;
  }catch(e){ console.error('ntfy send fail',e); return false; }
}

const THREE_DAYS_MS=3*24*3600*1000;

function trySchedule(y,m,d){
  const settings=getSettings();
  if(!settings.topic) return null;
  const events=getEvents(y,m,d);
  if(!events.length) return null;
  const notifyDate=new Date(y,m-1,d);
  notifyDate.setDate(notifyDate.getDate()-1);
  notifyDate.setHours(settings.hour,settings.minute,0,0);
  const delayMs=notifyDate-new Date();
  if(delayMs<10000||delayMs>THREE_DAYS_MS) return null;
  const content=events.map(e=>(e.icon||'')+e.text).join('、');
  const key='sched:'+dKey(y,m,d);
  const prev=NOTIFLOG[key];
  if(prev && prev.content===content) return null;
  return {key,content,msg:`明天行程：${content}`,delaySeconds:Math.floor(delayMs/1000)};
}

function tryLunarReminder(y,m,d){
  const settings=getSettings();
  if(!settings.topic || !settings.lunarReminder) return null;
  const lunar=solar2lunar(y,m,d);
  if(!lunar || (lunar.lDay!==1 && lunar.lDay!==15)) return null;
  const notifyDate=new Date(y,m-1,d);
  notifyDate.setDate(notifyDate.getDate()-1);
  notifyDate.setHours(settings.hour,settings.minute,0,0);
  const delayMs=notifyDate-new Date();
  if(delayMs<10000||delayMs>THREE_DAYS_MS) return null;
  const key='schedLunar:'+dKey(y,m,d);
  if(NOTIFLOG[key]) return null;
  const label=lunar.lDay===1?'初一':'十五';
  return {key,msg:`明天是農曆${label}，別忘了準備喔`,delaySeconds:Math.floor(delayMs/1000)};
}

async function scheduleForDate(y,m,d){
  const settings=getSettings();
  if(!settings.topic) return;
  const plan=trySchedule(y,m,d);
  if(plan){
    const ok=await sendNtfy(settings.topic,plan.msg,plan.delaySeconds);
    if(ok){ NOTIFLOG[plan.key]={content:plan.content,sentAt:Date.now()}; await persistNotifLog(); }
  }
  const lunarPlan=tryLunarReminder(y,m,d);
  if(lunarPlan){
    const ok=await sendNtfy(settings.topic,lunarPlan.msg,lunarPlan.delaySeconds);
    if(ok){ NOTIFLOG[lunarPlan.key]={sentAt:Date.now()}; await persistNotifLog(); }
  }
}

async function syncAll(){
  if(!dataLoaded) await loadAllData();
  const settings=getSettings();
  if(!settings.topic) return;
  const today=new Date();
  let dirty=false;
  for(let i=0;i<=5;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
    const plan=trySchedule(y,m,day);
    if(plan){
      const ok=await sendNtfy(settings.topic,plan.msg,plan.delaySeconds);
      if(ok){ NOTIFLOG[plan.key]={content:plan.content,sentAt:Date.now()}; dirty=true; }
    }
    const lunarPlan=tryLunarReminder(y,m,day);
    if(lunarPlan){
      const ok=await sendNtfy(settings.topic,lunarPlan.msg,lunarPlan.delaySeconds);
      if(ok){ NOTIFLOG[lunarPlan.key]={sentAt:Date.now()}; dirty=true; }
    }
  }
  if(dirty) await persistNotifLog();
}

/* ============ 時鐘 ============ */
function updateClock(){
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  const ss=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent=`${hh}:${mm}:${ss}`;
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
  document.getElementById('dateLine').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${wd}`;
}
setInterval(updateClock,1000); updateClock();

/* ============ 行事曆渲染 ============ */
let viewY=new Date().getFullYear();
let viewM=new Date().getMonth()+1; // 1-12
const today=new Date();

async function render(){
  if(!dataLoaded) await loadAllData();
  document.getElementById('monthLabel').textContent=`${viewY}年${String(viewM).padStart(2,'0')}月`;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const firstDow=new Date(viewY,viewM-1,1).getDay();
  const daysInMonth=new Date(viewY,viewM,0).getDate();
  const prevMonthDays=new Date(viewY,viewM-1,0).getDate();

  const cells=[];
  for(let i=firstDow-1;i>=0;i--){
    cells.push({d:prevMonthDays-i,other:true,y:viewM===1?viewY-1:viewY,m:viewM===1?12:viewM-1});
  }
  for(let d=1;d<=daysInMonth;d++){
    cells.push({d,other:false,y:viewY,m:viewM});
  }
  while(cells.length%7!==0 || cells.length<42){
    const nd=cells.length - (firstDow+daysInMonth) + 1;
    cells.push({d:nd,other:true,y:viewM===12?viewY+1:viewY,m:viewM===12?1:viewM+1});
    if(cells.length>=42) break;
  }

  for(const c of cells){
    const cell=document.createElement('div');
    cell.className='day-cell'+(c.other?' other-month':'');
    const dow=new Date(c.y,c.m-1,c.d).getDay();
    if(dow===0) cell.classList.add('weekend-sun');
    if(dow===6) cell.classList.add('weekend-sat');
    const key=dKey(c.y,c.m,c.d);
    const hol=HOLIDAYS[key];
    if(hol) cell.classList.add('holiday');
    if(!c.other && c.y===today.getFullYear() && c.m===today.getMonth()+1 && c.d===today.getDate()){
      cell.classList.add('today');
    }

    const lunar=solar2lunar(c.y,c.m,c.d);
    const lunarText = lunar ? (lunar.lDay===1 ? (lunar.isLeap?'閏':'')+['正','二','三','四','五','六','七','八','九','十','冬','腊'][lunar.lMonth-1]+'月' : dayCn(lunar.lDay)) : '';
    const isSpecialLunar = lunar && (lunar.lDay===1 || lunar.lDay===15);

    cell.innerHTML=`
      <div class="day-num">${c.d}</div>
      <div class="lunar-txt${isSpecialLunar?' red':''}">${lunarText}</div>
      ${hol?`<div class="holiday-name">${hol}</div>`:''}
      <div class="events-wrap" data-slot></div>
    `;
    cell.dataset.y=c.y; cell.dataset.m=c.m; cell.dataset.d=c.d;
    grid.appendChild(cell);

    renderEventsIntoCell(cell, getEvents(c.y,c.m,c.d));
    attachLongPress(cell, c.y, c.m, c.d);
  }
}

function renderEventsIntoCell(cell,events){
  const slot=cell.querySelector('[data-slot]');
  if(!slot) return;
  slot.innerHTML='';
  if(!events || !events.length) return;
  // 用文字顯示（跟節日名稱一樣清楚），不用圖示，避免格子太小塞不下
  const shown=events.slice(0,3);
  shown.forEach(e=>{
    const line=document.createElement('div');
    line.className='evt-line cat-'+(e.cat||'other');
    line.textContent=e.text||'';
    slot.appendChild(line);
  });
  if(events.length>3){
    const more=document.createElement('div');
    more.className='evt-more';
    more.textContent=`+${events.length-3} 項`;
    slot.appendChild(more);
  }
}

function findCellEl(y,m,d){
  return document.querySelector(`.day-cell[data-y="${y}"][data-m="${m}"][data-d="${d}"]`);
}

/* ============ 長按偵測 ============ */
function attachLongPress(el,y,m,d){
  let timer=null, moved=false, startX=0, startY=0;
  const THRESHOLD=480;
  const start=(x,y0)=>{
    moved=false; startX=x; startY=y0;
    timer=setTimeout(()=>{ if(!moved) openDaySheet(y,m,d); },THRESHOLD);
  };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(Math.abs(t.clientX-startX)>10||Math.abs(t.clientY-startY)>10){ moved=true; cancel(); }
  },{passive:true});
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchcancel',cancel);
  el.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
  el.addEventListener('mousemove',e=>{
    if(timer){ if(Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10){ moved=true; cancel(); } }
  });
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
}

/* ============ 日期詳情 / 新增表單 ============ */
let currentDay={y:null,m:null,d:null};

function updateIconPreview(){
  const cat=document.getElementById('catSelect').value;
  document.getElementById('iconPreview').textContent=CATS[cat].icon;
  document.getElementById('catPreviewLabel').textContent=CATS[cat].label;
  const input=document.getElementById('textInput');
  input.className='';
  input.classList.add('cat-'+cat);
}
document.getElementById('catSelect').addEventListener('change',updateIconPreview);

async function openDaySheet(y,m,d){
  currentDay={y,m,d};
  const wd=['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];
  const lunar=solar2lunar(y,m,d);
  document.getElementById('dayTitle').textContent=`${y}年${m}月${d}日（星期${wd}）`;
  document.getElementById('daySub').textContent = lunar ? `農曆${(lunar.isLeap?'閏':'')+['正','二','三','四','五','六','七','八','九','十','冬','腊'][lunar.lMonth-1]}月${dayCn(lunar.lDay)}` : '';
  document.getElementById('textInput').value='';
  document.getElementById('catSelect').value='hospital';
  updateIconPreview();
  refreshExistingList();
  document.getElementById('dayOverlay').classList.remove('hidden');
}

function refreshExistingList(){
  const {y,m,d}=currentDay;
  const events=getEvents(y,m,d);
  const list=document.getElementById('existingList');
  list.innerHTML='';
  if(!events.length){
    list.innerHTML='<div style="color:var(--ink-soft);font-size:.95rem;">目前這天還沒有項目</div>';
    return;
  }
  events.forEach(e=>{
    const row=document.createElement('div');
    row.className='existing-item cat-'+(e.cat||'other');
    row.innerHTML=`<span class="icon">${e.icon||''}</span><span class="txt">${e.text}</span><button data-id="${e.id}">🗑️</button>`;
    row.querySelector('button').addEventListener('click',async()=>{
      const arr=getEvents(y,m,d).filter(x=>x.id!==e.id);
      EVENTS[dKey(y,m,d)]=arr;
      const saved=await persistEvents();
      refreshExistingList();
      const cellEl=findCellEl(y,m,d);
      if(cellEl) renderEventsIntoCell(cellEl,arr);
      showToast(saved?'已刪除':'刪除失敗，請稍後再試');
    });
    list.appendChild(row);
  });
}

document.getElementById('closeDaySheet').addEventListener('click',()=>{
  document.getElementById('dayOverlay').classList.add('hidden');
});
document.getElementById('cancelAddBtn').addEventListener('click',()=>{
  document.getElementById('dayOverlay').classList.add('hidden');
});

document.getElementById('saveEventBtn').addEventListener('click',async()=>{
  const text=document.getElementById('textInput').value.trim();
  if(!text){ showToast('請先輸入內容'); return; }
  const cat=document.getElementById('catSelect').value;
  const {y,m,d}=currentDay;
  const events=getEvents(y,m,d).slice();
  events.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),cat,icon:CATS[cat].icon,text});
  EVENTS[dKey(y,m,d)]=events;
  const saved=await persistEvents();
  document.getElementById('textInput').value='';
  const cellEl=findCellEl(y,m,d);
  if(cellEl) renderEventsIntoCell(cellEl,events);
  if(saved) scheduleForDate(y,m,d);
  if(saved){
    document.getElementById('dayOverlay').classList.add('hidden');
  }
  showToast(saved?'已新增，前一天會自動通知':'新增失敗，請稍後再試');
});

/* ============ 設定 ============ */
document.getElementById('openSettings').addEventListener('click',async()=>{
  if(!dataLoaded) await loadAllData();
  const s=getSettings();
  document.getElementById('ntfyTopicInput').value=s.topic||'';
  document.getElementById('notifyTimeInput').value=`${String(s.hour).padStart(2,'0')}:${String(s.minute).padStart(2,'0')}`;
  document.getElementById('lunarReminderCheck').checked=s.lunarReminder!==false;
  document.getElementById('settingsOverlay').classList.remove('hidden');
});
document.getElementById('closeSettingsSheet').addEventListener('click',()=>{
  document.getElementById('settingsOverlay').classList.add('hidden');
});
document.getElementById('saveSettingsBtn').addEventListener('click',async()=>{
  const topic=document.getElementById('ntfyTopicInput').value.trim();
  const [hh,mm]=document.getElementById('notifyTimeInput').value.split(':').map(Number);
  const lunarReminder=document.getElementById('lunarReminderCheck').checked;
  const saved=await saveSettings({topic,hour:hh||8,minute:mm||0,lunarReminder});
  showToast(saved?'設定已儲存':'儲存失敗，請稍後再試');
  document.getElementById('settingsOverlay').classList.add('hidden');
  syncAll();
});

/* 自動儲存：主題名稱輸入完（失去焦點或停止輸入 600ms）就自動存到本機，不必按儲存鍵 */
let topicSaveTimer=null;
document.getElementById('ntfyTopicInput').addEventListener('input',()=>{
  clearTimeout(topicSaveTimer);
  topicSaveTimer=setTimeout(async()=>{
    const ok=await saveSettings({topic:document.getElementById('ntfyTopicInput').value.trim()});
    if(ok) showToast('主題名稱已自動儲存');
  },600);
});
document.getElementById('ntfyTopicInput').addEventListener('blur',async()=>{
  clearTimeout(topicSaveTimer);
  await saveSettings({topic:document.getElementById('ntfyTopicInput').value.trim()});
});
document.getElementById('notifyTimeInput').addEventListener('change',async()=>{
  const [hh,mm]=document.getElementById('notifyTimeInput').value.split(':').map(Number);
  await saveSettings({hour:hh||8,minute:mm||0});
  showToast('提醒時間已自動儲存');
});
document.getElementById('lunarReminderCheck').addEventListener('change',async()=>{
  await saveSettings({lunarReminder:document.getElementById('lunarReminderCheck').checked});
});

/* ============ 備份 / 還原 ============ */
function backupFileName(){
  const d=new Date();
  return `family-calendar-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
}
document.getElementById('exportBackupBtn').addEventListener('click',async()=>{
  try{
    if(!dataLoaded) await loadAllData();
    const payload={exportedAt:new Date().toISOString(),settings:SETTINGS,events:EVENTS};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=backupFileName();
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },500);
    showToast('備份檔案已下載');
  }catch(e){
    console.error(e);
    showToast('匯出失敗，請再試一次');
  }
});
document.getElementById('importBackupBtn').addEventListener('click',()=>{
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change',async(e)=>{
  const file=e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    if(payload.settings){ SETTINGS={...DEFAULT_SETTINGS,...payload.settings}; await sSet('settings',SETTINGS); }
    if(payload.events){ EVENTS=payload.events; await sSet('events',EVENTS); }
    const s=getSettings();
    document.getElementById('ntfyTopicInput').value=s.topic||'';
    document.getElementById('notifyTimeInput').value=`${String(s.hour).padStart(2,'0')}:${String(s.minute).padStart(2,'0')}`;
    document.getElementById('lunarReminderCheck').checked=s.lunarReminder!==false;
    render();
    showToast('備份已還原');
  }catch(err){
    console.error(err);
    showToast('檔案格式錯誤，還原失敗');
  }
  e.target.value='';
});
document.getElementById('testNotifyBtn').addEventListener('click',async()=>{
  const topic=document.getElementById('ntfyTopicInput').value.trim();
  if(!topic){ showToast('請先輸入 ntfy 主題名稱'); return; }
  const ok=await sendNtfy(topic,'這是一則測試通知，日曆設定成功！');
  showToast(ok?'測試通知已送出':'送出失敗，請檢查網路或主題名稱');
});

/* ============ 導覽 ============ */
document.getElementById('prevBtn').addEventListener('click',()=>{
  viewM--; if(viewM<1){viewM=12;viewY--;}
  render();
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  viewM++; if(viewM>12){viewM=1;viewY++;}
  render();
});

/* ============ 按鍵音 ============ */
let audioCtx=null;
function playClick(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.value=880;
    gain.gain.setValueAtTime(0.18,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.09);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+0.1);
  }catch(e){ /* audio not available, ignore */ }
}
document.addEventListener('click',e=>{
  if(e.target.closest('button')) playClick();
},true);

/* ============ Toast ============ */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ 啟動 ============ */
(async()=>{
  await loadAllData();
  await render();
  syncAll();
})();
</script>
