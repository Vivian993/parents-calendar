<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>爸媽的日曆</title>
<style>
  :root{
    --cream:#FFF8EF;
    --card:#FFFFFF;
    --plum:#7A4763;
    --plum-dark:#5E3650;
    --coral:#E1735A;
    --coral-dark:#C85A42;
    --sage:#7C9885;
    --gold:#FBE3A0;
    --gold-text:#8A6114;
    --red:#D14343;
    --ink:#3B2E35;
    --ink-soft:#7A6B72;
    --line:#EFDFCB;
    --hospital-bg:#DCEEFB; --hospital-text:#1F5C8B;
    --hair-bg:#FBE1EC; --hair-text:#A73D6B;
    --bill-bg:#E3F1DE; --bill-text:#3F7A34;
    --other-bg:#EFEAF2; --other-text:#5E4A6B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    color:var(--ink);
    padding-bottom:40px;
    -webkit-tap-highlight-color:transparent;
  }
  .top{
    background:linear-gradient(135deg,var(--plum),var(--plum-dark));
    color:#fff;
    padding:22px 18px 26px;
    border-radius:0 0 28px 28px;
    box-shadow:0 6px 18px rgba(94,54,80,.25);
    position:relative;
  }
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .clock{
    font-size:clamp(2.6rem,10vw,3.6rem);
    font-weight:800;
    letter-spacing:2px;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .date-line{
    font-size:clamp(1.05rem,4vw,1.3rem);
    margin-top:8px;
    opacity:.95;
    font-weight:600;
  }
  .settings-btn{
    background:rgba(255,255,255,.18);
    border:none;
    color:#fff;
    font-size:1.6rem;
    width:52px;height:52px;
    border-radius:16px;
    cursor:pointer;
  }
  .cal-card{
    background:var(--card);
    margin:16px 12px 0;
    border-radius:22px;
    box-shadow:0 4px 16px rgba(122,71,99,.10);
    padding:14px 10px 18px;
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:4px 6px 12px;
  }
  .nav-btn{
    background:var(--gold);
    color:var(--gold-text);
    border:none;
    width:48px;height:48px;
    border-radius:14px;
    font-size:1.6rem;
    font-weight:700;
    cursor:pointer;
  }
  .month-label{
    font-size:clamp(1.3rem,5vw,1.7rem);
    font-weight:800;
    color:var(--plum-dark);
  }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-weight:700;
    font-size:1rem;
    color:var(--ink-soft);
    padding-bottom:6px;
    border-bottom:2px solid var(--line);
    margin-bottom:6px;
  }
  .weekday-row div:first-child{color:var(--coral-dark);}
  .weekday-row div:last-child{color:var(--plum);}
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
  }
  .day-cell{
    min-height:92px;
    border-radius:14px;
    background:#FCFAF6;
    border:1px solid var(--line);
    padding:6px 4px 4px;
    position:relative;
    display:flex;
    flex-direction:column;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  .day-cell.other-month{opacity:.35;}
  .day-cell.holiday{background:var(--gold);border-color:#EFCB6E;}
  .day-cell.today{outline:3px solid var(--coral);outline-offset:-3px;}
  .day-num{
    font-size:1.15rem;
    font-weight:800;
    color:var(--ink);
    line-height:1;
  }
  .day-cell.weekend-sun .day-num{color:var(--coral-dark);}
  .day-cell.weekend-sat .day-num{color:var(--plum);}
  .lunar-txt{
    font-size:.72rem;
    color:var(--ink-soft);
    margin-top:2px;
    font-weight:600;
  }
  .lunar-txt.red{color:var(--red);font-weight:800;}
  .holiday-name{
    font-size:.65rem;
    color:var(--gold-text);
    font-weight:800;
    margin-top:1px;
    line-height:1.1;
  }
  .events-wrap{
    margin-top:auto;
    display:flex;
    flex-direction:column;
    gap:2px;
    padding-top:3px;
  }
  .evt-chip{
    font-size:.68rem;
    font-weight:700;
    border-radius:7px;
    padding:1px 4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .evt-chip.cat-hospital{background:var(--hospital-bg);color:var(--hospital-text);}
  .evt-chip.cat-hair{background:var(--hair-bg);color:var(--hair-text);}
  .evt-chip.cat-bill{background:var(--bill-bg);color:var(--bill-text);}
  .evt-chip.cat-other{background:var(--other-bg);color:var(--other-text);}
  .evt-more{font-size:.65rem;color:var(--ink-soft);font-weight:700;}

  /* Modal / bottom sheet */
  .overlay{
    position:fixed;inset:0;
    background:rgba(59,46,53,.45);
    display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .overlay.hidden{display:none;}
  .sheet{
    background:var(--card);
    width:100%;max-width:520px;
    border-radius:26px 26px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;
    overflow-y:auto;
    box-shadow:0 -8px 30px rgba(0,0,0,.2);
  }
  .sheet.center{
    border-radius:26px;
    margin:0 14px;
    max-height:90vh;
  }
  .sheet-title{
    font-size:1.5rem;font-weight:800;color:var(--plum-dark);
    margin-bottom:4px;
  }
  .sheet-sub{color:var(--ink-soft);font-size:.95rem;margin-bottom:14px;}
  .existing-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .existing-item{
    display:flex;align-items:center;gap:10px;
    background:#FBF6EF;border-radius:14px;padding:10px 12px;
    font-size:1.05rem;font-weight:600;
  }
  .existing-item .icon{font-size:1.4rem;}
  .existing-item .txt{flex:1;}
  .existing-item button{
    border:none;background:none;font-size:1.3rem;cursor:pointer;padding:4px 8px;
  }
  label.field-label{
    display:block;font-weight:800;font-size:1.05rem;margin:14px 0 6px;color:var(--plum-dark);
  }
  select, input[type=text], input[type=time], input[type=number]{
    width:100%;
    font-size:1.25rem;
    padding:13px 12px;
    border-radius:14px;
    border:2px solid var(--line);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  .icon-preview{
    display:flex;align-items:center;gap:10px;margin-top:8px;font-size:1.1rem;color:var(--ink-soft);
  }
  .icon-preview span.big{font-size:2rem;}
  #textInput.cat-hospital{background:var(--hospital-bg);color:var(--hospital-text);border-color:var(--hospital-text);}
  #textInput.cat-hair{background:var(--hair-bg);color:var(--hair-text);border-color:var(--hair-text);}
  #textInput.cat-bill{background:var(--bill-bg);color:var(--bill-text);border-color:var(--bill-text);}
  #textInput.cat-other{background:var(--other-bg);color:var(--other-text);border-color:var(--other-text);}
  .existing-item.cat-hospital{background:var(--hospital-bg);color:var(--hospital-text);}
  .existing-item.cat-hair{background:var(--hair-bg);color:var(--hair-text);}
  .existing-item.cat-bill{background:var(--bill-bg);color:var(--bill-text);}
  .existing-item.cat-other{background:var(--other-bg);color:var(--other-text);}
  .btn-row{display:flex;gap:10px;margin-top:20px;}
  .btn{
    flex:1;
    border:none;border-radius:16px;
    padding:15px 10px;
    font-size:1.15rem;
    font-weight:800;
    cursor:pointer;
  }
  .btn-primary{background:var(--coral);color:#fff;}
  .btn-secondary{background:#F1EAE0;color:var(--ink);}
  .btn-close{
    position:sticky;top:0;text-align:right;margin-bottom:-6px;
  }
  .btn-close button{
    border:none;background:#F1EAE0;color:var(--ink-soft);
    width:38px;height:38px;border-radius:12px;font-size:1.2rem;cursor:pointer;
  }
  .toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
    background:var(--plum-dark);color:#fff;padding:12px 20px;border-radius:14px;
    font-size:1rem;font-weight:700;z-index:99;box-shadow:0 4px 14px rgba(0,0,0,.25);
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .toast.show{opacity:1;}
  .hint-box{
    background:#F6EFE2;border-radius:14px;padding:12px 14px;font-size:.85rem;color:var(--ink-soft);
    margin-top:14px;line-height:1.5;
  }
  .checkbox-row{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:1.05rem;font-weight:700;}
  .checkbox-row input{width:24px;height:24px;}
</style>
</head>

</div>

<div class="hint-box" style="margin:16px 14px;">
  💡 長按日期方格，即可新增看病、美髮、繳費等提醒，系統會在前一天自動用 ntfy 通知手機。農曆初一、十五也會自動提醒。
</div>

<!-- Day detail / add event sheet -->
<div class="overlay hidden" id="dayOverlay">
  <div class="sheet">
    <div class="btn-close"><button id="closeDaySheet">✕</button></div>

    <div class="sheet-sub" id="daySub"></div>

    <label class="field-label">內容文字</label>

    <div class="btn-row">
      <button class="btn btn-secondary" id="cancelAddBtn">取消</button>
      <button class="btn btn-primary" id="saveEventBtn">新增這筆</button>
    </div>

</div>

<!-- Settings sheet -->
<div class="overlay hidden" id="settingsOverlay">
  <div class="sheet center">
    <div class="btn-close"><button id="closeSettingsSheet">✕</button></div>
    <div class="sheet-title">通知設定</div>
    <div class="sheet-sub">設定 ntfy 主題名稱，前一天會自動發送提醒到爸媽的手機（請先在手機安裝 ntfy App 並訂閱相同主題）。</div>

    <label class="field-label">ntfy 主題名稱（topic）</label>
    <input type="text" id="ntfyTopicInput" placeholder="例如：chen-family-cal-7788">

    <label class="field-label">每天提醒時間</label>
    <input type="time" id="notifyTimeInput" value="08:00">

    <div class="checkbox-row">
      <input type="checkbox" id="lunarReminderCheck" checked>
      <label for="lunarReminderCheck">農曆初一、十五自動提醒（前一天）</label>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="testNotifyBtn">傳送測試通知</button>
      <button class="btn btn-primary" id="saveSettingsBtn">儲存設定</button>
    </div>
    <div class="hint-box">
      提醒主題請自訂一串不容易被別人猜到的英數字，避免陌生人收到通知。ntfy 是免費公開服務，訊息會經過 ntfy.sh 伺服器轉送。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,

0x0d520];
function leapMonthOf(y){return LUNAR_INFO[y-1900]&0xf;}
function leapDaysOf(y){return leapMonthOf(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0;}
function monthDaysOf(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function lYearDaysOf(y){
  let sum=348; const info=LUNAR_INFO[y-1900];
  for(let i=0x8000;i>0x8;i>>=1){sum+=(info&i)?1:0;}
  return sum+leapDaysOf(y);
}
function solar2lunar(y,m,d){
  if(y<1900||y>2100) return null;
  let offset=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  let i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDaysOf(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  const lYear=i;
  const leap=leapMonthOf(lYear);
  let isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===leap+1&&!isLeap){i--;isLeap=true;temp=leapDaysOf(lYear);}
    else{temp=monthDaysOf(lYear,i);}
    if(isLeap&&i===leap+1)isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){
    if(isLeap){isLeap=false;}else{isLeap=true;i--;}
  }
  if(offset<0){offset+=temp;i--;}
  return {lYear,lMonth:i,lDay:offset+1,isLeap};
}
const N1=['日','一','二','三','四','五','六','七','八','九','十'];
const N2=['初','十','廿','卅'];
function dayCn(d){
  if(d===10)return '初十'; if(d===20)return '二十'; if(d===30)return '三十';
  return N2[Math.floor(d/10)]+N1[d%10];
}

/* ============ 類別設定 ============ */
const CATS={
  hospital:{label:'醫院（回診）',icon:'🏥'},
  hair:{label:'美髮',icon:'💇'},

/* ============ 儲存輔助 ============ */
async function sGet(key){
  try{ const r=await window.storage.get(key,false); return r?JSON.parse(r.value):null; }
  catch(e){ return null; }
}
async function sSet(key,val){
  try{ await window.storage.set(key,JSON.stringify(val),false); return true; }
  catch(e){ console.error('storage set fail',e); return false; }
}
function dKey(y,m,d){ return `${y}-${m}-${d}`; }
async function getEvents(y,m,d){ return (await sGet('events:'+dKey(y,m,d))) || []; }
async function setEvents(y,m,d,arr){ return sSet('events:'+dKey(y,m,d),arr); }

const DEFAULT_SETTINGS={topic:'',hour:8,minute:0,lunarReminder:true};
async function getSettings(){ const s=await sGet('settings'); return s?{...DEFAULT_SETTINGS,...s}:DEFAULT_SETTINGS; }

/* ============ ntfy 推播 ============ */
function ntfyUrl(topic){
  if(/^https?:\/\//i.test(topic)) return topic;
  return 'https://ntfy.sh/'+encodeURIComponent(topic);
}
async function sendNtfy(topic,message,delaySeconds){
  if(!topic) return false;
  const headers={'Content-Type':'text/plain; charset=utf-8'};
  if(delaySeconds && delaySeconds>0) headers['Delay']=Math.ceil(delaySeconds)+'s';
  try{
    const res=await fetch(ntfyUrl(topic),{method:'POST',headers,body:message});
    return res.ok;
  }catch(e){ console.error('ntfy send fail',e); return false; }
}

const THREE_DAYS_MS=3*24*3600*1000;

async function trySchedule(y,m,d){
  const settings=await getSettings();
  if(!settings.topic) return;
  const events=await getEvents(y,m,d);
  if(!events.length) return;
  const notifyDate=new Date(y,m-1,d);
  notifyDate.setDate(notifyDate.getDate()-1);
  notifyDate.setHours(settings.hour,settings.minute,0,0);
  const delayMs=notifyDate-new Date();
  if(delayMs<10000||delayMs>THREE_DAYS_MS) return;
  const content=events.map(e=>(e.icon||'')+e.text).join('、');
  const key='sched:'+dKey(y,m,d);
  const prev=await sGet(key);
  if(prev && prev.content===content) return;
  const msg=`明天行程：${content}`;
  const ok=await sendNtfy(settings.topic,msg,Math.floor(delayMs/1000));
  if(ok) await sSet(key,{content,sentAt:Date.now()});
}

async function tryLunarReminder(y,m,d){
  const settings=await getSettings();
  if(!settings.topic || !settings.lunarReminder) return;
  const lunar=solar2lunar(y,m,d);
  if(!lunar || (lunar.lDay!==1 && lunar.lDay!==15)) return;
  const notifyDate=new Date(y,m-1,d);
  notifyDate.setDate(notifyDate.getDate()-1);
  notifyDate.setHours(settings.hour,settings.minute,0,0);
  const delayMs=notifyDate-new Date();
  if(delayMs<10000||delayMs>THREE_DAYS_MS) return;
  const key='schedLunar:'+dKey(y,m,d);
  if(await sGet(key)) return;
  const label=lunar.lDay===1?'初一':'十五';
  const ok=await sendNtfy(settings.topic,`明天是農曆${label}，別忘了準備喔`,Math.floor(delayMs/1000));
  if(ok) await sSet(key,{sentAt:Date.now()});
}

async function syncAll(){
  const today=new Date();
  for(let i=0;i<=5;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    await trySchedule(d.getFullYear(),d.getMonth()+1,d.getDate());
    await tryLunarReminder(d.getFullYear(),d.getMonth()+1,d.getDate());
  }
}

/* ============ 時鐘 ============ */
function updateClock(){
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  const ss=String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent=`${hh}:${mm}:${ss}`;
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][now.getDay()];
  document.getElementById('dateLine').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${wd}`;
}
setInterval(updateClock,1000); updateClock();

/* ============ 行事曆渲染 ============ */
let viewY=new Date().getFullYear();
let viewM=new Date().getMonth()+1; // 1-12
const today=new Date();

async function render(){
  document.getElementById('monthLabel').textContent=`${viewY}年${String(viewM).padStart(2,'0')}月`;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const firstDow=new Date(viewY,viewM-1,1).getDay();
  const daysInMonth=new Date(viewY,viewM,0).getDate();
  const prevMonthDays=new Date(viewY,viewM-1,0).getDate();

  const cells=[];
  for(let i=firstDow-1;i>=0;i--){
    cells.push({d:prevMonthDays-i,other:true,y:viewM===1?viewY-1:viewY,m:viewM===1?12:viewM-1});
  }
  for(let d=1;d<=daysInMonth;d++){
    cells.push({d,other:false,y:viewY,m:viewM});
  }
  while(cells.length%7!==0 || cells.length<42){
    const nd=cells.length - (firstDow+daysInMonth) + 1;
    cells.push({d:nd,other:true,y:viewM===12?viewY+1:viewY,m:viewM===12?1:viewM+1});
    if(cells.length>=42) break;
  }

  for(const c of cells){
    const cell=document.createElement('div');
    cell.className='day-cell'+(c.other?' other-month':'');
    const dow=new Date(c.y,c.m-1,c.d).getDay();
    if(dow===0) cell.classList.add('weekend-sun');
    if(dow===6) cell.classList.add('weekend-sat');
    const key=dKey(c.y,c.m,c.d);
    const hol=HOLIDAYS[key];
    if(hol) cell.classList.add('holiday');
    if(!c.other && c.y===today.getFullYear() && c.m===today.getMonth()+1 && c.d===today.getDate()){
      cell.classList.add('today');
    }

    const lunar=solar2lunar(c.y,c.m,c.d);
    const lunarText = lunar ? (lunar.lDay===1 ? (lunar.isLeap?'閏':'')+['正','二','三','四','五','六','七','八','九','十','冬','腊'][lunar.lMonth-1]+'月' : dayCn(lunar.lDay)) : '';
    const isSpecialLunar = lunar && (lunar.lDay===1 || lunar.lDay===15);

    cell.innerHTML=`
      <div class="day-num">${c.d}</div>
      <div class="lunar-txt${isSpecialLunar?' red':''}">${lunarText}</div>
      ${hol?`<div class="holiday-name">${hol}</div>`:''}
      <div class="events-wrap" data-slot></div>
    `;
    grid.appendChild(cell);

    // load events async
    getEvents(c.y,c.m,c.d).then(events=>{
      const slot=cell.querySelector('[data-slot]');
      if(!events.length) return;
      const shown=events.slice(0,2);
      shown.forEach(e=>{
        const chip=document.createElement('div');
        chip.className='evt-chip cat-'+(e.cat||'other');
        chip.textContent=`${e.icon||''}${e.text}`;
        slot.appendChild(chip);
      });
      if(events.length>2){
        const more=document.createElement('div');
        more.className='evt-more';
        more.textContent=`+${events.length-2} 項`;
        slot.appendChild(more);
      }
    });

    attachLongPress(cell, c.y, c.m, c.d);
  }
}

/* ============ 長按偵測 ============ */
function attachLongPress(el,y,m,d){
  let timer=null, moved=false, startX=0, startY=0;
  const THRESHOLD=480;
  const start=(x,y0)=>{
    moved=false; startX=x; startY=y0;
    timer=setTimeout(()=>{ if(!moved) openDaySheet(y,m,d); },THRESHOLD);
  };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(Math.abs(t.clientX-startX)>10||Math.abs(t.clientY-startY)>10){ moved=true; cancel(); }
  },{passive:true});
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchcancel',cancel);
  el.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
  el.addEventListener('mousemove',e=>{
    if(timer){ if(Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10){ moved=true; cancel(); } }
  });
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
}

/* ============ 日期詳情 / 新增表單 ============ */
let currentDay={y:null,m:null,d:null};

function updateIconPreview(){
  const cat=document.getElementById('catSelect').value;
  document.getElementById('iconPreview').textContent=CATS[cat].icon;
  document.getElementById('catPreviewLabel').textContent=CATS[cat].label;
  const input=document.getElementById('textInput');
  input.className='';
  input.classList.add('cat-'+cat);
}
document.getElementById('catSelect').addEventListener('change',updateIconPreview);

async function openDaySheet(y,m,d){
  currentDay={y,m,d};
  const wd=['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];
  const lunar=solar2lunar(y,m,d);
  document.getElementById('dayTitle').textContent=`${y}年${m}月${d}日（星期${wd}）`;
  document.getElementById('daySub').textContent = lunar ? `農曆${(lunar.isLeap?'閏':'')+['正','二','三','四','五','六','七','八','九','十','冬','腊'][lunar.lMonth-1]}月${dayCn(lunar.lDay)}` : '';
  document.getElementById('textInput').value='';
  document.getElementById('catSelect').value='hospital';
  updateIconPreview();
  await refreshExistingList();
  document.getElementById('dayOverlay').classList.remove('hidden');
}

async function refreshExistingList(){
  const {y,m,d}=currentDay;
  const events=await getEvents(y,m,d);
  const list=document.getElementById('existingList');
  list.innerHTML='';
  if(!events.length){
    list.innerHTML='<div style="color:var(--ink-soft);font-size:.95rem;">目前這天還沒有項目</div>';
    return;
  }
  events.forEach(e=>{
    const row=document.createElement('div');
    row.className='existing-item cat-'+(e.cat||'other');
    row.innerHTML=`<span class="icon">${e.icon||''}</span><span class="txt">${e.text}</span><button data-id="${e.id}">🗑️</button>`;
    row.querySelector('button').addEventListener('click',async()=>{
      const arr=(await getEvents(y,m,d)).filter(x=>x.id!==e.id);
      await setEvents(y,m,d,arr);
      await refreshExistingList();
      render();
      showToast('已刪除');
    });
    list.appendChild(row);
  });
}

document.getElementById('closeDaySheet').addEventListener('click',()=>{
  document.getElementById('dayOverlay').classList.add('hidden');
});
document.getElementById('cancelAddBtn').addEventListener('click',()=>{
  document.getElementById('dayOverlay').classList.add('hidden');
});

document.getElementById('saveEventBtn').addEventListener('click',async()=>{
  const text=document.getElementById('textInput').value.trim();
  if(!text){ showToast('請先輸入內容'); return; }
  const cat=document.getElementById('catSelect').value;
  const {y,m,d}=currentDay;
  const events=await getEvents(y,m,d);
  events.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),cat,icon:CATS[cat].icon,text});
  await setEvents(y,m,d,events);
  document.getElementById('textInput').value='';
  await refreshExistingList();
  render();
  await trySchedule(y,m,d);
  showToast('已新增，前一天會自動通知');
});

/* ============ 設定 ============ */
document.getElementById('openSettings').addEventListener('click',async()=>{
  const s=await getSettings();
  document.getElementById('ntfyTopicInput').value=s.topic||'';
  document.getElementById('notifyTimeInput').value=`${String(s.hour).padStart(2,'0')}:${String(s.minute).padStart(2,'0')}`;
  document.getElementById('lunarReminderCheck').checked=s.lunarReminder!==false;
  document.getElementById('settingsOverlay').classList.remove('hidden');
});
document.getElementById('closeSettingsSheet').addEventListener('click',()=>{
  document.getElementById('settingsOverlay').classList.add('hidden');
});
document.getElementById('saveSettingsBtn').addEventListener('click',async()=>{
  const topic=document.getElementById('ntfyTopicInput').value.trim();
  const [hh,mm]=document.getElementById('notifyTimeInput').value.split(':').map(Number);
  const lunarReminder=document.getElementById('lunarReminderCheck').checked;
  await sSet('settings',{topic,hour:hh||8,minute:mm||0,lunarReminder});
  showToast('設定已儲存');
  document.getElementById('settingsOverlay').classList.add('hidden');
  syncAll();
});
document.getElementById('testNotifyBtn').addEventListener('click',async()=>{
  const topic=document.getElementById('ntfyTopicInput').value.trim();
  if(!topic){ showToast('請先輸入 ntfy 主題名稱'); return; }
  const ok=await sendNtfy(topic,'這是一則測試通知，日曆設定成功！');
  showToast(ok?'測試通知已送出':'送出失敗，請檢查網路或主題名稱');
});

/* ============ 導覽 ============ */
document.getElementById('prevBtn').addEventListener('click',()=>{
  viewM--; if(viewM<1){viewM=12;viewY--;}
  render();
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  viewM++; if(viewM>12){viewM=1;viewY++;}
  render();
});

/* ============ 按鍵音 ============ */
let audioCtx=null;
function playClick(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.value=880;
    gain.gain.setValueAtTime(0.18,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.09);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime+0.1);
  }catch(e){ /* audio not available, ignore */ }
}
document.addEventListener('click',e=>{
  if(e.target.closest('button')) playClick();
},true);

/* ============ Toast ============ */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ 啟動 ============ */
render();
syncAll();
</script>
