<style>
  :root{
    --cream:#FFF6EC;
    --card:#FFFFFF;
    --plum:#8B4FA8;
    --plum-dark:#5D3384;
    --header-a:#FF7A59;
    --header-b:#8B4FA8;
    --coral:#FF6B4A;
    --coral-dark:#E8502F;
    --sage:#2FB380;
    --gold:#FFE9B8;
    --gold-text:#8A5A14;
    --today-bg:#E9DBFB;
    --today-border:#9B6FD1;
    --red:#E23E3E;
    --ink:#3B2E35;
    --ink-soft:#7A6B72;
    --line:#F3DFC7;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    height:100dvh;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .top{
    background:linear-gradient(135deg,var(--header-a),var(--header-b));
    color:#fff;
    padding:10px 16px 12px;
    border-radius:0 0 22px 22px;
    box-shadow:0 6px 18px rgba(94,54,80,.25);
    position:relative;
    flex:0 0 auto;
  }
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .clock{
    font-size:clamp(1.6rem,5.8vh,2.2rem);
    font-weight:800;
    letter-spacing:1.5px;
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .date-line{
    font-size:clamp(.9rem,2.2vh,1.02rem);
    margin-top:5px;
    opacity:.95;
    font-weight:600;
  }
  .today-yiji{
    margin-top:4px;
    font-size:clamp(.72rem,1.9vh,.85rem);
    font-weight:700;
    background:rgba(255,255,255,.16);
    border-radius:10px;
    padding:4px 9px;
    display:inline-flex;
    gap:10px;
    cursor:pointer;
  }
  .today-yiji b{font-weight:900;margin-right:2px;}
  .settings-btn{
    background:rgba(255,255,255,.18);
    border:none;
    color:#fff;
    font-size:1.4rem;
    width:44px;height:44px;
    border-radius:14px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .cal-card{
    background:var(--card);
    margin:10px 10px 0;
    border-radius:20px;
    box-shadow:0 4px 16px rgba(122,71,99,.10);
    padding:10px 8px 10px;
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
  }
  .nav-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 4px 8px;
    flex:0 0 auto;
  }
  .nav-btn{
    background:var(--gold);
    color:var(--gold-text);
    border:none;
    width:42px;height:42px;
    border-radius:13px;
    font-size:1.4rem;
    font-weight:700;
    cursor:pointer;
  }
  .month-label{
    font-size:clamp(1.15rem,3.4vh,1.5rem);
    font-weight:800;
    color:var(--plum-dark);
  }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-weight:700;
    font-size:.92rem;
    color:var(--ink-soft);
    padding-bottom:5px;
    border-bottom:2px solid var(--line);
    margin-bottom:5px;
    flex:0 0 auto;
  }
  .weekday-row div:first-child{color:var(--coral-dark);}
  .weekday-row div:last-child{color:var(--plum);}
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:4px;
    flex:1 1 auto;
    min-height:0;
  }
  .day-cell{
    min-height:0;
    min-width:0;
    border-radius:13px;
    background:#FCFAF6;
    border:1px solid var(--line);
    padding:5px 4px 3px;
    position:relative;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
  }
  .day-cell.other-month{opacity:.35;}
  .day-cell.holiday{background:var(--gold);border-color:#F0DFAE;}
  .day-cell.today{background:var(--today-bg);border-color:var(--today-border);}
  .day-num{
    font-size:clamp(.85rem,2.3vh,1.2rem);
    font-weight:800;
    color:var(--ink);
    line-height:1;
  }
  .day-cell.weekend-sun .day-num{color:var(--coral-dark);}
  .day-cell.weekend-sat .day-num{color:var(--plum);}
  .lunar-txt{
    font-size:clamp(.6rem,1.5vh,.82rem);
    color:var(--ink-soft);
    margin-top:2px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lunar-txt.red{color:var(--red);font-weight:800;}
  .holiday-name{
    font-size:clamp(.55rem,1.3vh,.72rem);
    color:var(--gold-text);
    font-weight:800;
    margin-top:1px;
    line-height:1.15;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;

  .events-wrap{
    display:flex;

    gap:2px;
    margin-top:3px;
    overflow:hidden;
  }
  .evt-line{
    font-size:clamp(.6rem,1.5vh,.85rem);
    font-weight:800;
    line-height:1.22;
    border-radius:6px;
    padding:1px 5px;

    -webkit-line-clamp:3;

  .day-cell.touch-active{

  .lunar-card-day{

  .lunar-card-red{color:var(--red);font-size:1rem;font-weight:800;}
  .lunar-card-holiday{

    font-size:1.25rem;

    color:var(--ink);

  .checkbox-row input{width:24px;height:24px;}

    <div class="sheet-sub">設定 ntfy 主題名稱，前一天會自動發送提醒到爸媽的手機（請先在手機安裝 ntfy App 並訂閱相同主題）。</div>


    <label class="field-label">ntfy 主題名稱（topic）</label>
    <input type="text" id="ntfyTopicInput" placeholder="例如：chen-family-cal-7788">

    <label class="field-label">每天提醒時間</label>
    <input type="time" id="notifyTimeInput" value="08:00">

    <div class="checkbox-row">
      <input type="checkbox" id="lunarReminderCheck" checked>

    <div class="btn-row">
      <button class="btn btn-secondary" id="testNotifyBtn">傳送測試通知</button>
      <button class="btn btn-primary" id="saveSettingsBtn">儲存設定</button>
    </div>
    <label class="field-label">資料備份</label>
    <div class="btn-row">
      <button class="btn btn-secondary" id="exportBackupBtn">📤 匯出備份</button>
      <button class="btn btn-secondary" id="importBackupBtn">📥 匯入備份</button>
    </div>
    <input type="file" id="importFileInput" accept="application/json" style="display:none;">
    <div class="hint-box">
      ntfy 主題名稱會自動儲存在這台裝置上，不用按儲存也會留著。建議偶爾按「匯出備份」把設定和所有行程存成一個檔案，換手機或不小心清除瀏覽器資料時可以用「匯入備份」救回來。
    </div>
    <div class="hint-box">
      提醒主題請自訂一串不容易被別人猜到的英數字，避免陌生人收到通知。ntfy 是免費公開服務，訊息會經過 ntfy.sh 伺服器轉送。
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 農曆計算（1900-2100，資料來源：jjonline/calendar.js 公開演算法） ============ */
const LUNAR_INFO=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,

0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x05ac0,0x0ab60,0x096d5,0x092e0,
0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,
0x0d520];
function leapMonthOf(y){return LUNAR_INFO[y-1900]&0xf;}
function leapDaysOf(y){return leapMonthOf(y)?((LUNAR_INFO[y-1900]&0x10000)?30:29):0;}
function monthDaysOf(y,m){return (LUNAR_INFO[y-1900]&(0x10000>>m))?30:29;}
function lYearDaysOf(y){
  let sum=348; const info=LUNAR_INFO[y-1900];
  for(let i=0x8000;i>0x8;i>>=1){sum+=(info&i)?1:0;}
  return sum+leapDaysOf(y);
}
function solar2lunar(y,m,d){
  if(y<1900||y>2100) return null;
  let offset=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,31))/86400000);
  let i,temp=0;
  for(i=1900;i<2101&&offset>0;i++){temp=lYearDaysOf(i);offset-=temp;}
  if(offset<0){offset+=temp;i--;}
  const lYear=i;
  const leap=leapMonthOf(lYear);
  let isLeap=false;
  for(i=1;i<13&&offset>0;i++){
    if(leap>0&&i===leap+1&&!isLeap){i--;isLeap=true;temp=leapDaysOf(lYear);}
    else{temp=monthDaysOf(lYear,i);}
    if(isLeap&&i===leap+1)isLeap=false;
    offset-=temp;
  }
  if(offset===0&&leap>0&&i===leap+1){
    if(isLeap){isLeap=false;}else{isLeap=true;i--;}
  }
  if(offset<0){offset+=temp;i--;}
  return {lYear,lMonth:i,lDay:offset+1,isLeap};
}
const N1=['日','一','二','三','四','五','六','七','八','九','十'];
const N2=['初','十','廿','卅'];
function dayCn(d){
  if(d===10)return '初十'; if(d===20)return '二十'; if(d===30)return '三十';
  return N2[Math.floor(d/10)]+N1[d%10];
}

/* ============ 台灣國定假日（2025 / 2026 為精確版；其他年份自動計算，含農曆節日） ============ */
const HOLIDAYS={

'2025-2-28':'和平紀念日','2025-4-3':'兒童節調整','2025-4-4':'兒童節','2025-4-5':'清明節',
'2025-5-1':'勞動節','2025-5-31':'端午節','2025-9-28':'教師節','2025-9-29':'教師節補假',

// 2025、2026 以外的年份，政府尚未（或本表尚未更新）公告確切補假日，
// 這裡用固定國曆日期＋農曆節日（春節／端午／中秋）自動算出基本假日，
// 讓 2027 年以後的月曆也看得到節日；補假調整日不在此自動範圍內。
const FIXED_SOLAR_HOLIDAYS=[
  [1,1,'元旦'],[2,28,'和平紀念日'],[4,4,'兒童節'],[4,5,'清明節'],[5,1,'勞動節'],
  [9,28,'教師節'],[10,10,'國慶日'],[10,25,'台灣光復節'],[12,25,'行憲紀念日']
];
const holidaysCache={};
function computeGenericHolidays(year){
  const list={};
  FIXED_SOLAR_HOLIDAYS.forEach(([m,d,name])=>{ list[`${year}-${m}-${d}`]=name; });
  for(let m=1;m<=12;m++){
    const daysInM=new Date(year,m,0).getDate();
    for(let d=1;d<=daysInM;d++){
      const l=solar2lunar(year,m,d);
      if(!l||l.isLeap) continue;
      if(l.lMonth===1&&l.lDay===1){
        list[`${year}-${m}-${d}`]='春節初一';
        const prev=new Date(year,m-1,d-1);
        list[`${prev.getFullYear()}-${prev.getMonth()+1}-${prev.getDate()}`]='除夕';
        const d2=new Date(year,m-1,d+1);
        list[`${d2.getFullYear()}-${d2.getMonth()+1}-${d2.getDate()}`]='春節初二';
        const d3=new Date(year,m-1,d+2);
        list[`${d3.getFullYear()}-${d3.getMonth()+1}-${d3.getDate()}`]='春節初三';
      }
      if(l.lMonth===5&&l.lDay===5) list[`${year}-${m}-${d}`]='端午節';
      if(l.lMonth===8&&l.lDay===15) list[`${year}-${m}-${d}`]='中秋節';
    }
  }
  return list;
}
function getHoliday(y,m,d){
  const key=`${y}-${m}-${d}`;
  if(HOLIDAYS[key]) return HOLIDAYS[key];
  if(y===2025||y===2026) return null;
  if(!holidaysCache[y]) holidaysCache[y]=computeGenericHolidays(y);
  return holidaysCache[y][key]||null;
}

/* ============ 簡易黃曆：建除十二值日（宜／忌），僅供傳統參考，非精準命理 ============ */
function dayGanZhiIndex(y,m,d){
  const diff=Math.round((Date.UTC(y,m-1,d)-Date.UTC(1900,0,1))/86400000);
  return ((10+diff)%60+60)%60;
}
const JIANCHU=['建','除','滿','平','定','執','破','危','成','收','開','閉'];
const JIANCHU_YI={
  '建':['祭祀','祈福','出行'], '除':['掃除','求醫','理髮'], '滿':['祭祀','開市','嫁娶'],
  '平':['修造','整理雜物'], '定':['嫁娶','簽約','入宅'], '執':['修造','栽種','動土'],
  '破':['拆卸','清理舊物'], '危':['祭祀','祈福，宜謹慎'], '成':['嫁娶','開市','入宅'],
  '收':['納財','收款','簽約'], '開':['開市','出行','動土'], '閉':['安葬','修造']
};
const JIANCHU_JI={
  '建':['動土','開市'], '除':['嫁娶','開市'], '滿':['動土','安葬'],
  '平':['開市','嫁娶'], '定':['興訟','遠行'], '執':['開市','遠行'],
  '破':['嫁娶','出行，簽約'], '危':['登高','搭乘交通工具'], '成':['興訟'],
  '收':['開市','出行'], '開':['安葬'], '閉':['開市','嫁娶']
};
function getYiJi(y,m,d){
  const lunar=solar2lunar(y,m,d);
  if(!lunar) return null;
  const monthBranch=(lunar.lMonth+1)%12;
  const dayIdx=dayGanZhiIndex(y,m,d);
  const dayBranch=dayIdx%12;
  const officerIdx=((dayBranch-monthBranch)%12+12)%12;
  const officer=JIANCHU[officerIdx];
  return {officer, yi:JIANCHU_YI[officer], ji:JIANCHU_JI[officer]};
}

/* ============ 儲存輔助（改用瀏覽器 localStorage） ============ */
/* 注意：window.storage 只有在 Claude.ai 的 Artifact 預覽環境才存在；
   這個檔案是要放到 GitHub Pages／自己網站上讓爸媽當作獨立網頁使用，
   所以必須改用瀏覽器原生的 localStorage，才能真正把資料存在手機本機上。 */
async function sGet(key){
  try{
    const raw=localStorage.getItem(key);
    return raw!=null ? JSON.parse(raw) : null;
  }catch(e){ console.error('storage get fail',e); return null; }
}
async function sSet(key,val){
  try{
    localStorage.setItem(key,JSON.stringify(val));
    return true;
  }catch(e){ console.error('storage set fail',e); return false; }
}
function dKey(y,m,d){ return `${y}-${m}-${d}`; }

const DEFAULT_SETTINGS={topic:'',hour:8,minute:0,lunarReminder:true,colorCounter:0};

// 記憶體快取：整個 app 只用三把 key（events / settings / notiflog），
// 讀寫都在記憶體裡完成，最後才整包寫回，避免逐日逐格呼叫造成頻率限制而「新增失敗」。
let EVENTS={};      // { "2026-8-27": [ {id,cat,icon,text}, ... ] }
let SETTINGS={...DEFAULT_SETTINGS};
let NOTIFLOG={};     // { "sched:2026-8-27": {...}, "schedLunar:2026-8-27": {...} }
let dataLoaded=false;

async function loadAllData(){
  const [ev,st,nl]=await Promise.all([sGet('events'),sGet('settings'),sGet('notiflog')]);
  EVENTS = ev || {};
  SETTINGS = {...DEFAULT_SETTINGS, ...(st||{})};
  NOTIFLOG = nl || {};
  dataLoaded=true;
}

function getEvents(y,m,d){ return EVENTS[dKey(y,m,d)] || []; }
async function persistEvents(){ return sSet('events',EVENTS); }

function getSettings(){ return SETTINGS; }
async function saveSettings(partial){
  SETTINGS = {...SETTINGS, ...partial};
  return sSet('settings',SETTINGS);
}
async function persistNotifLog(){ return sSet('notiflog',NOTIFLOG); }

/* ============ ntfy 推播 ============ */
function ntfyUrl(topic){
  if(/^https?:\/\//i.test(topic)) return topic;
  return 'https://ntfy.sh/'+encodeURIComponent(topic);
}
async function sendNtfy(topic,message,delaySeconds){
  if(!topic) return false;
  const headers={'Content-Type':'text/plain; charset=utf-8'};
  if(delaySeconds && delaySeconds>0) headers['Delay']=Math.ceil(delaySeconds)+'s';
  try{
    const res=await fetch(ntfyUrl(topic),{method:'POST',headers,body:message});
    return res.ok;
  }catch(e){ console.error('ntfy send fail',e); return false; }
}

const THREE_DAYS_MS=3*24*3600*1000;

function trySchedule(y,m,d){
  const settings=getSettings();
  if(!settings.topic) return null;
  const events=getEvents(y,m,d);
  if(!events.length) return null;
  const notifyDate=new Date(y,m-1,d);
  notifyDate.setDate(notifyDate.getDate()-1);
  notifyDate.setHours(settings.hour,settings.minute,0,0);
  const delayMs=notifyDate-new Date();
  if(delayMs<10000||delayMs>THREE_DAYS_MS) return null;
  const content=events.map(e=>e.text).join('、');
  const key='sched:'+dKey(y,m,d);
  const prev=NOTIFLOG[key];
  if(prev && prev.content===content) return null;
  return {key,content,msg:`明天行程：${content}`,delaySeconds:Math.floor(delayMs/1000)};
}

function tryLunarReminder(y,m,d){
  const settings=getSettings();
  if(!settings.topic || !settings.lunarReminder) return null;
  const lunar=solar2lunar(y,m,d);
  if(!lunar || (lunar.lDay!==1 && lunar.lDay!==15)) return null;
  const notifyDate=new Date(y,m-1,d);
  notifyDate.setDate(notifyDate.getDate()-1);
  notifyDate.setHours(settings.hour,settings.minute,0,0);
  const delayMs=notifyDate-new Date();
  if(delayMs<10000||delayMs>THREE_DAYS_MS) return null;
  const key='schedLunar:'+dKey(y,m,d);
  if(NOTIFLOG[key]) return null;
  const label=lunar.lDay===1?'初一':'十五';
  return {key,msg:`明天是農曆${label}，別忘了準備喔`,delaySeconds:Math.floor(delayMs/1000)};
}

async function scheduleForDate(y,m,d){
  const settings=getSettings();
  if(!settings.topic) return;
  const plan=trySchedule(y,m,d);
  if(plan){
    const ok=await sendNtfy(settings.topic,plan.msg,plan.delaySeconds);
    if(ok){ NOTIFLOG[plan.key]={content:plan.content,sentAt:Date.now()}; await persistNotifLog(); }
  }
  const lunarPlan=tryLunarReminder(y,m,d);
  if(lunarPlan){
    const ok=await sendNtfy(settings.topic,lunarPlan.msg,lunarPlan.delaySeconds);
    if(ok){ NOTIFLOG[lunarPlan.key]={sentAt:Date.now()}; await persistNotifLog(); }
  }
}

async function syncAll(){
  if(!dataLoaded) await loadAllData();
  const settings=getSettings();
  if(!settings.topic) return;
  const today=new Date();
  let dirty=false;
  for(let i=0;i<=5;i++){
    const d=new Date(today); d.setDate(d.getDate()+i);
    const y=d.getFullYear(), m=d.getMonth()+1, day=d.getDate();
    const plan=trySchedule(y,m,day);
    if(plan){
      const ok=await sendNtfy(settings.topic,plan.msg,plan.delaySeconds);
      if(ok){ NOTIFLOG[plan.key]={content:plan.content,sentAt:Date.now()}; dirty=true; }
    }
    const lunarPlan=tryLunarReminder(y,m,day);
    if(lunarPlan){
      const ok=await sendNtfy(settings.topic,lunarPlan.msg,lunarPlan.delaySeconds);
      if(ok){ NOTIFLOG[lunarPlan.key]={sentAt:Date.now()}; dirty=true; }
    }
  }
  if(dirty) await persistNotifLog();
}

/* ============ 行事曆渲染 ============ */
let viewY=new Date().getFullYear();
let viewM=new Date().getMonth()+1; // 1-12
const today=new Date();

async function render(){
  if(!dataLoaded) await loadAllData();
  selectedCellEl=null;
  document.getElementById('monthLabel').textContent=`${viewY}年${String(viewM).padStart(2,'0')}月`;
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const firstDow=new Date(viewY,viewM-1,1).getDay();
  const daysInMonth=new Date(viewY,viewM,0).getDate();
  const prevMonthDays=new Date(viewY,viewM-1,0).getDate();

  const cells=[];
  for(let i=firstDow-1;i>=0;i--){
    cells.push({d:prevMonthDays-i,other:true,y:viewM===1?viewY-1:viewY,m:viewM===1?12:viewM-1});
  }
  for(let d=1;d<=daysInMonth;d++){
    cells.push({d,other:false,y:viewY,m:viewM});
  }
  while(cells.length%7!==0 || cells.length<42){
    const nd=cells.length - (firstDow+daysInMonth) + 1;
    cells.push({d:nd,other:true,y:viewM===12?viewY+1:viewY,m:viewM===12?1:viewM+1});
    if(cells.length>=42) break;
  }

  for(const c of cells){
    const cell=document.createElement('div');
    cell.className='day-cell'+(c.other?' other-month':'');
    const dow=new Date(c.y,c.m-1,c.d).getDay();
    if(dow===0) cell.classList.add('weekend-sun');
    if(dow===6) cell.classList.add('weekend-sat');
    const key=dKey(c.y,c.m,c.d);
    const hol=getHoliday(c.y,c.m,c.d);
    if(hol) cell.classList.add('holiday');
    if(!c.other && c.y===today.getFullYear() && c.m===today.getMonth()+1 && c.d===today.getDate()){
      cell.classList.add('today');
    }

    const lunar=solar2lunar(c.y,c.m,c.d);
    const lunarText = lunar ? (lunar.lDay===1 ? (lunar.isLeap?'閏':'')+['正','二','三','四','五','六','七','八','九','十','冬','腊'][lunar.lMonth-1]+'月' : dayCn(lunar.lDay)) : '';
    const isSpecialLunar = lunar && (lunar.lDay===1 || lunar.lDay===15);

    cell.innerHTML=`
      <div class="day-num">${c.d}</div>
      <div class="lunar-txt${isSpecialLunar?' red':''}">${lunarText}</div>
      ${hol?`<div class="holiday-name">${hol}</div>`:''}
      <div class="events-wrap" data-slot></div>
    `;
    cell.dataset.y=c.y; cell.dataset.m=c.m; cell.dataset.d=c.d;
    grid.appendChild(cell);

    renderEventsIntoCell(cell, getEvents(c.y,c.m,c.d));
    attachLongPress(cell, c.y, c.m, c.d);
  }
}

function colorOf(e){
  const idx=(typeof e.colorIdx==='number')?e.colorIdx:0;
  return PALETTE[idx%PALETTE.length];
}

function renderEventsIntoCell(cell,events){
  const slot=cell.querySelector('[data-slot]');
  if(!slot) return;
  slot.innerHTML='';
  if(!events || !events.length) return;
  const shown=events.slice(0,3);
  shown.forEach(e=>{
    const c=colorOf(e);
    const line=document.createElement('div');
    line.className='evt-line';
    line.style.background=c.bg;
    line.style.color=c.text;
    line.textContent=e.text||'';
    slot.appendChild(line);
  });
  if(events.length>3){
    const more=document.createElement('div');
    more.className='evt-more';
    more.textContent=`+${events.length-3} 項`;
    slot.appendChild(more);
  }
}

function findCellEl(y,m,d){
  return document.querySelector(`.day-cell[data-y="${y}"][data-m="${m}"][data-d="${d}"]`);
}

/* ============ 長按偵測 ============ */
function attachLongPress(el,y,m,d){
  let timer=null, moved=false, startX=0, startY=0;
  const THRESHOLD=480;
  const start=(x,y0)=>{
    moved=false; startX=x; startY=y0;
    el.classList.add('touch-active');
    timer=setTimeout(()=>{ if(!moved) openDaySheet(y,m,d); },THRESHOLD);
  };
  const cancel=()=>{
    if(timer){ clearTimeout(timer); timer=null; }
    el.classList.remove('touch-active');
  };
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(Math.abs(t.clientX-startX)>10||Math.abs(t.clientY-startY)>10){ moved=true; cancel(); }
  },{passive:true});
  el.addEventListener('touchend',cancel);
  el.addEventListener('touchcancel',cancel);
  el.addEventListener('mousedown',e=>start(e.clientX,e.clientY));
  el.addEventListener('mousemove',e=>{
    if(timer){ if(Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10){ moved=true; cancel(); } }
  });
  el.addEventListener('mouseup',cancel);
  el.addEventListener('mouseleave',cancel);
}

const TIANGAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const DIZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ZODIAC=['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
function ganZhiYear(lY){
  const idx=(lY-4+6000)%60;
  return TIANGAN[idx%10]+DIZHI[idx%12];
}
function zodiacYear(lY){
  return ZODIAC[(lY-4+6000)%12];
}

async function openDaySheet(y,m,d){
  currentDay={y,m,d};
  clearSelectedCell();
  const cellEl=findCellEl(y,m,d);
  if(cellEl){ cellEl.classList.add('selected'); selectedCellEl=cellEl; }
  const wd=['日','一','二','三','四','五','六'][new Date(y,m-1,d).getDay()];
  const lunar=solar2lunar(y,m,d);
  document.getElementById('dayTitle').textContent=`${y}年${m}月${d}日（星期${wd}）`;

  if(lunar){
    const monthName=(lunar.isLeap?'閏':'')+['正','二','三','四','五','六','七','八','九','十','冬','腊'][lunar.lMonth-1]+'月';
    document.getElementById('lunarYearLine').textContent=`農曆${ganZhiYear(lunar.lYear)}年（生肖：${zodiacYear(lunar.lYear)}）`;
    document.getElementById('lunarDayLine').innerHTML=`${monthName}${dayCn(lunar.lDay)}${(lunar.lDay===1||lunar.lDay===15)?' <span class="lunar-card-red">（拜拜日）</span>':''}`;
  } else {
    document.getElementById('lunarYearLine').textContent='';
    document.getElementById('lunarDayLine').textContent='';
  }
  const hol=getHoliday(y,m,d);
  document.getElementById('lunarHolidayLine').textContent = hol ? `🏮 ${hol}` : '';

  const yj=getYiJi(y,m,d);
  document.getElementById('yiText').textContent = yj ? yj.yi.join('、') : '—';
  document.getElementById('jiText').textContent = yj ? yj.ji.join('、') : '—';

  document.getElementById('textInput').value='';
  refreshExistingList();
  document.getElementById('dayOverlay').classList.remove('hidden');
}

function refreshExistingList(){
  const {y,m,d}=currentDay;
  const events=getEvents(y,m,d);
  const list=document.getElementById('existingList');
  list.innerHTML='';
  if(!events.length){
    list.innerHTML='<div style="color:var(--ink-soft);font-size:.95rem;">目前這天還沒有項目</div>';
    return;
  }
  events.forEach(e=>{
    const row=document.createElement('div');
    const c=colorOf(e);
    row.className='existing-item';
    row.style.background=c.bg;
    row.style.color=c.text;
    row.innerHTML=`<span class="txt">${e.text}</span><button data-id="${e.id}">🗑️</button>`;
    row.querySelector('button').addEventListener('click',async()=>{
      const arr=getEvents(y,m,d).filter(x=>x.id!==e.id);
      EVENTS[dKey(y,m,d)]=arr;
      const saved=await persistEvents();
      refreshExistingList();
      const cellEl=findCellEl(y,m,d);
      if(cellEl) renderEventsIntoCell(cellEl,arr);
      showToast(saved?'已刪除':'刪除失敗，請稍後再試');
    });
    list.appendChild(row);
  });
}

});

document.getElementById('saveEventBtn').addEventListener('click',async()=>{
  const text=document.getElementById('textInput').value.trim();
  if(!text){ showToast('請先輸入內容'); return; }
  const {y,m,d}=currentDay;
  const events=getEvents(y,m,d).slice();
  const colorIdx=nextColor();
  events.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),colorIdx,text});
  EVENTS[dKey(y,m,d)]=events;
  const saved=await persistEvents();
  if(saved) await sSet('settings',SETTINGS); // 順便存下輪替顏色的計數器
  document.getElementById('textInput').value='';
  const cellEl=findCellEl(y,m,d);
  if(cellEl) renderEventsIntoCell(cellEl,events);
  if(saved) scheduleForDate(y,m,d);
  if(saved){
    document.getElementById('dayOverlay').classList.add('hidden');
    clearSelectedCell();
  }
  showToast(saved?'已新增，前一天會自動通知':'新增失敗，請稍後再試');
});

/* ============ 設定 ============ */

/* 自動儲存：主題名稱輸入完（失去焦點或停止輸入 600ms）就自動存到本機，不必按儲存鍵 */
let topicSaveTimer=null;
document.getElementById('ntfyTopicInput').addEventListener('input',()=>{

  topicSaveTimer=setTimeout(async()=>{
    const ok=await saveSettings({topic:document.getElementById('ntfyTopicInput').value.trim()});

});
document.getElementById('notifyTimeInput').addEventListener('change',async()=>{

document.getElementById('lunarReminderCheck').addEventListener('change',async()=>{

});

/* ============ 備份 / 還原 ============ */
function backupFileName(){
  const d=new Date();
  return `family-calendar-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
}
document.getElementById('exportBackupBtn').addEventListener('click',async()=>{
  try{
    if(!dataLoaded) await loadAllData();
    const payload={exportedAt:new Date().toISOString(),settings:SETTINGS,events:EVENTS};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=backupFileName();
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },500);
    showToast('備份檔案已下載');
  }catch(e){
    console.error(e);
    showToast('匯出失敗，請再試一次');
  }
});
document.getElementById('importBackupBtn').addEventListener('click',()=>{
  document.getElementById('importFileInput').click();
});
document.getElementById('importFileInput').addEventListener('change',async(e)=>{
  const file=e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const payload=JSON.parse(text);
    if(payload.settings){ SETTINGS={...DEFAULT_SETTINGS,...payload.settings}; await sSet('settings',SETTINGS); }
    if(payload.events){ EVENTS=payload.events; await sSet('events',EVENTS); }
    const s=getSettings();
    document.getElementById('ntfyTopicInput').value=s.topic||'';
    document.getElementById('notifyTimeInput').value=`${String(s.hour).padStart(2,'0')}:${String(s.minute).padStart(2,'0')}`;
    document.getElementById('lunarReminderCheck').checked=s.lunarReminder!==false;
    render();
    showToast('備份已還原');
  }catch(err){
    console.error(err);
    showToast('檔案格式錯誤，還原失敗');
  }
  e.target.value='';
});
document.getElementById('testNotifyBtn').addEventListener('click',async()=>{
  const topic=document.getElementById('ntfyTopicInput').value.trim();
  if(!topic){ showToast('請先輸入 ntfy 主題名稱'); return; }
  const ok=await sendNtfy(topic,'這是一則測試通知，日曆設定成功！');
  showToast(ok?'測試通知已送出':'送出失敗，請檢查網路或主題名稱');
});

/* ============ 按鍵音 ============ */
let audioCtx=null;
function ensureAudioCtx(){
  if(!audioCtx){
    try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; }
  }
  if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  return audioCtx;
}
function playClick(){
  try{
    const ctx=ensureAudioCtx();
    if(!ctx) return;
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.type='triangle';
    osc.frequency.setValueAtTime(1000,ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700,ctx.currentTime+0.09);
    gain.gain.setValueAtTime(0.001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.35,ctx.currentTime+0.008);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.13);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime+0.14);
  }catch(e){ /* audio not available, ignore */ }
}
// iOS 等瀏覽器需要在使用者第一次觸控時才能解鎖音效播放權限
['touchstart','click'].forEach(evt=>{
  document.addEventListener(evt,()=>ensureAudioCtx(),{once:true,passive:true});
});
document.addEventListener('click',e=>{
  if(e.target.closest('button')) playClick();
},true);

/* ============ Toast ============ */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ 啟動 ============ */
(async()=>{
  await loadAllData();
  await render();
  syncAll();
})();
